<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e1a;
      --panel: #14182c;
      --accent: #ff8c37;
      --accent-2: #5be7c4;
      --text: #e5e8f0;
      --muted: #a5adc6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 20%, rgba(91, 231, 196, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 30%, rgba(255, 140, 55, 0.08), transparent 32%),
                  var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .player {
      width: min(960px, 100%);
      background: linear-gradient(135deg, rgba(20, 24, 44, 0.96), rgba(10, 12, 28, 0.96));
      border: 2px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(91, 231, 196, 0.08);
      border-radius: 20px;
      overflow: hidden;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: linear-gradient(120deg, rgba(255, 140, 55, 0.05), rgba(91, 231, 196, 0.05));
    }

    @media (max-width: 720px) {
      .top { grid-template-columns: 1fr; }
    }

    .info h1 {
      font-family: 'Press Start 2P', cursive;
      letter-spacing: 1px;
      font-size: clamp(18px, 3vw, 22px);
      margin: 0 0 12px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255, 140, 55, 0.3);
    }

    .info p {
      margin: 6px 0;
      color: var(--muted);
    }

    .cassette {
      position: relative;
      background: linear-gradient(160deg, #1e243d, #0f1326);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 18px 12px;
      box-shadow: inset 0 0 0 1px rgba(91, 231, 196, 0.08);
    }

    .cassette::before,
    .cassette::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      pointer-events: none;
    }

    .window {
      background: #0b0d1d;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .reel {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle, rgba(91, 231, 196, 0.25) 0, rgba(91, 231, 196, 0.05) 50%, transparent 60%),
                  radial-gradient(circle at 60% 35%, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0));
      position: relative;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: spin 12s linear infinite;
    }

    .reel::after {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 140, 55, 0.2);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .track-meta {
      flex: 1;
    }

    .track-meta .label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .track-title {
      margin: 4px 0 8px;
      font-size: 18px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    button, input[type="range"] {
      appearance: none;
      outline: none;
    }

    .btn {
      background: linear-gradient(120deg, var(--accent), #ffa75c);
      color: #0f0e17;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .5px;
      box-shadow: 0 12px 30px rgba(255, 140, 55, 0.35);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(255, 140, 55, 0.4); }
    .btn:active { transform: translateY(0); box-shadow: 0 10px 24px rgba(255, 140, 55, 0.35); }

    .ghost {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .progress {
      margin-top: 14px;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border-radius: inherit;
      transition: width 0.12s linear;
    }

    .timecodes {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .playlist {
      padding: 20px 24px 28px;
      background: rgba(0, 0, 0, 0.2);
    }

    .playlist h2 {
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all .16s ease;
    }

    li:hover {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
    }

    li.active {
      border-color: rgba(91, 231, 196, 0.4);
      box-shadow: 0 0 0 1px rgba(91, 231, 196, 0.2);
      background: rgba(91, 231, 196, 0.08);
    }

    .badge {
      font-family: 'Press Start 2P', cursive;
      color: var(--accent-2);
      font-size: 10px;
      letter-spacing: 1px;
    }

    .title {
      font-weight: 600;
    }

    .artist { color: var(--muted); font-size: 13px; }

    .duration { color: var(--muted); font-variant-numeric: tabular-nums; }

    .sliders { display: flex; gap: 12px; margin-top: 12px; align-items: center; }
    .sliders label { color: var(--muted); font-size: 13px; }

    input[type="range"] {
      width: 140px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: -4px;
      box-shadow: 0 0 0 4px rgba(255, 140, 55, 0.25);
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      box-shadow: 0 0 0 4px rgba(255, 140, 55, 0.25);
    }
  </style>
</head>
<body>
  <div class="player" role="application" aria-label="Retro music player">
    <div class="top">
      <div class="info">
        <h1>Retro Cassette Deck</h1>
        <p>Three chill tracks, a cassette-inspired shell, and some neon glow. Tap a track to start.</p>
        <div class="cassette">
          <div class="window">
            <div class="reel" aria-hidden="true"></div>
            <div class="track-meta">
              <div class="label">Now Playing</div>
              <div class="track-title" id="nowTitle">—</div>
              <div class="artist" id="nowArtist">Select a track</div>
            </div>
          </div>
          <div class="controls">
            <button class="btn ghost" id="prev">⏮ Prev</button>
            <button class="btn" id="play">▶ Play</button>
            <button class="btn ghost" id="next">Next ⏭</button>
          </div>
          <div class="progress" aria-label="Playback progress">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="timecodes">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
          <div class="sliders">
            <label for="volume">Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume slider">
          </div>
        </div>
      </div>
      <div class="artwork" aria-hidden="true">
        <svg width="100%" height="100%" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" style="filter: drop-shadow(0 14px 35px rgba(0,0,0,0.4));">
          <defs>
            <linearGradient id="grad" x1="0%" x2="100%" y1="0%" y2="100%">
              <stop offset="0%" stop-color="#5be7c4" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#ff8c37" stop-opacity="0.9" />
            </linearGradient>
          </defs>
          <rect x="12" y="12" width="296" height="216" rx="24" fill="#0f1225" stroke="url(#grad)" stroke-width="6" />
          <g fill="none" stroke="url(#grad)" stroke-width="4">
            <path d="M60 180 L260 60" opacity="0.55" />
            <path d="M60 140 L260 100" opacity="0.35" />
            <circle cx="110" cy="120" r="34" />
            <circle cx="210" cy="120" r="34" />
            <path d="M110 120 A50 40 0 0 0 210 120" />
          </g>
          <text x="50%" y="90%" text-anchor="middle" fill="#e5e8f0" font-family="'Press Start 2P', monospace" font-size="14">LO-FI VIBES</text>
        </svg>
      </div>
    </div>
    <div class="playlist">
      <h2>Playlist</h2>
      <ul id="trackList"></ul>
    </div>
  </div>

  <script>
    const tracks = [
      {
        title: 'Analog Dreams',
        artist: 'Synth Lab',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
        duration: '6:13'
      },
      {
        title: 'VHS Sunrise',
        artist: 'Neon Tide',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
        duration: '5:06'
      },
      {
        title: 'Night Stroll',
        artist: 'City Lights',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
        duration: '5:31'
      }
    ];

    const audio = new Audio(tracks[0].src);
    audio.volume = 0.8;

    let currentIndex = 0;
    const trackListEl = document.getElementById('trackList');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const playBtn = document.getElementById('play');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volume');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function renderList() {
      trackListEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = index === currentIndex ? 'active' : '';
        li.innerHTML = `
          <span class="badge">${index + 1}</span>
          <div>
            <div class="title">${track.title}</div>
            <div class="artist">${track.artist}</div>
          </div>
          <span class="duration">${track.duration}</span>
        `;
        li.addEventListener('click', () => switchTrack(index, true));
        trackListEl.appendChild(li);
      });
    }

    function switchTrack(index, playAfter = false) {
      currentIndex = (index + tracks.length) % tracks.length;
      audio.src = tracks[currentIndex].src;
      audio.load();
      nowTitle.textContent = tracks[currentIndex].title;
      nowArtist.textContent = tracks[currentIndex].artist;
      durationEl.textContent = tracks[currentIndex].duration;
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      renderList();
      if (playAfter) {
        audio.play();
        playBtn.textContent = '⏸ Pause';
      }
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸ Pause';
      } else {
        audio.pause();
        playBtn.textContent = '▶ Play';
      }
    });

    prevBtn.addEventListener('click', () => switchTrack(currentIndex - 1, true));
    nextBtn.addEventListener('click', () => switchTrack(currentIndex + 1, true));

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime || 0);
      durationEl.textContent = isFinite(audio.duration) ? formatTime(audio.duration) : tracks[currentIndex].duration;
    });

    audio.addEventListener('ended', () => switchTrack(currentIndex + 1, true));

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * audio.duration;
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = Number(volumeSlider.value);
    });

    switchTrack(0);
  </script>
</body>
</html>
